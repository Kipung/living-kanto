[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "living-kanto-server"
version = "0.1.0"
description = "Living Kanto local simulation server: contracts, store, API"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "websockets>=13",
    "pydantic>=2.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27", "pytest-asyncio>=0.23"]

[tool.setuptools.packages.find]
include = ["living_kanto*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
