<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>People and NPCs</title><style>:root{color-scheme:dark;font:14px system-ui;background:#172b20;color:#e6eddf}body{margin:20px}h1{font-size:20px;color:#ead698}p{line-height:1.5;color:#b7cbb8}input,select{font:inherit;background:#263e2f;color:#edf3e5;border:1px solid #617861;border-radius:6px;padding:9px;margin:0 5px 12px 0}table{width:100%;border-collapse:collapse;text-align:left}th,td{padding:10px 7px;border-bottom:1px solid #3c5540}th{color:#ead698}#error{color:#ffb7a0}@media(max-width:500px){body{margin:12px}th,td{font-size:12px;padding:8px 4px}}</style></head><body><h1>People &amp; NPCs</h1><p id="summary" role="status">Reading people in this world…</p><p>The original FireRed NPC import and workplace routines are awaiting backend integration. This list shows the people currently present in your saved world.</p><input id="search" aria-label="Find an NPC" placeholder="Name, role or location"><select id="category" aria-label="NPC category"><option value="all">Everyone</option><option value="gym">Gym &amp; League</option><option value="service">Services &amp; workers</option><option value="resident">Residents &amp; professor</option></select><p id="error" role="alert"></p><table><thead><tr><th>Person</th><th>Role</th><th>Location</th><th>Activity</th></tr></thead><tbody id="people"></tbody></table><script type="module" src="/client/unified/npcs.mjs"></script></body></html>
