<!doctype html><html><head><meta charset="utf-8"><title>Field effects visual test</title><style>body{background:#14251c;color:#eedeb0;font:16px system-ui;margin:30px}canvas{background:#20362a;border-radius:14px;max-width:100%}p{color:#b9ceb9}</style></head><body><h1>Field effects · visual test</h1><p>Isolated renderer examples. These do not move people or change any saved world.</p><canvas id="preview" width="1100" height="400"></canvas><script type="module">
import {drawFieldEffects,drawMapBadge,drawTraversalAura,drawFlashWindow} from '../field-effects.mjs';
import {createNativeFieldRenderer} from '../native-field-sprites.mjs';const renderer=createNativeFieldRenderer();
const canvas=document.getElementById('preview'),ctx=canvas.getContext('2d'),kinds=['cut','surf','strength','flash','fly'],labels=['✂️ Original tree frames','🌊 Original splash / Surf','🪨 Original boulder','✨ Original Flash window','🪽 Original Fly bird'];
function frame(now){ctx.clearRect(0,0,1100,400);for(let i=0;i<5;i++){ctx.save();ctx.translate(i*220,0);ctx.fillStyle='#ead99a';ctx.font='15px system-ui';ctx.fillText(labels[i],12,40);ctx.scale(3,3);ctx.beginPath();ctx.rect(0,0,220/3,400/3);ctx.clip();const age=now%1000;drawFieldEffects(ctx,{map_name:'TEST'},[{kind:kinds[i],map_id:'TEST',position:{x:1.8,y:4},start:now-age,until:now-age+2400,direction:'east',human_id:'preview'}],{now,renderer});if(i===3)drawFlashWindow(ctx,{map_name:'TEST',width:5,height:9,events:{requires_flash:true}},{human_id:'preview',map_id:'TEST',x:1.8,y:4,field:{flash_active:true}},[{human_id:'preview',kind:'flash',map_id:'TEST',start:now-age,until:now-age+2400}],{now});if(i===1)drawTraversalAura(ctx,{status:{surfing:true}},{x:28,y:78,timeMs:now,moving:true,renderer});if(i===0)renderer.draw(ctx,'cut_tree',{x:37,y:110,elapsedMs:0,hold:true});if(i===2)renderer.draw(ctx,'strength_boulder',{x:37,y:110,elapsedMs:0,hold:true});drawMapBadge(ctx,{kind:kinds[i],icon:labels[i].split(' ')[0],label:kinds[i],recent:true},{x:37,y:78,zoom:3});ctx.restore();}requestAnimationFrame(frame);}requestAnimationFrame(frame);
</script></body></html>
